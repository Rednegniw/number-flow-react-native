name: Sync secrets to view-recorder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Copy Actions secrets
    runs-on: ubuntu-latest
    steps:
      - name: Sync repository secrets
        env:
          GH_TOKEN: ${{ secrets.SYNC_GH_TOKEN }}
          TARGET_REPO: Rednegniw/react-native-view-recorder
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          ANALYTICS_GITHUB_TOKEN: ${{ secrets.ANALYTICS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh secret set TELEGRAM_BOT_TOKEN -R "$TARGET_REPO" -b"$TELEGRAM_BOT_TOKEN"
          gh secret set TELEGRAM_CHAT_ID -R "$TARGET_REPO" -b"$TELEGRAM_CHAT_ID"
          gh secret set POSTHOG_PERSONAL_API_KEY -R "$TARGET_REPO" -b"$POSTHOG_PERSONAL_API_KEY"
          gh secret set POSTHOG_PROJECT_ID -R "$TARGET_REPO" -b"$POSTHOG_PROJECT_ID"
          gh secret set ANALYTICS_GITHUB_TOKEN -R "$TARGET_REPO" -b"$ANALYTICS_GITHUB_TOKEN"
          echo "Secrets synced to $TARGET_REPO"
